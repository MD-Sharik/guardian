[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-sdk"
version = "0.1.0"
description = "Wrap AI agent tools so every call is checked by Guardian before it runs."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
guardian-antigravity-hook = "guardian.antigravity:main"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]

[tool.setuptools]
packages = ["guardian"]
